<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ej. 10 — Guardar el nombre</title>
<link rel="stylesheet" href="../estilos.css">
</head>
<body>
<main>
  <h1>Ejercicio 10 — Guardar el nombre</h1>
  <p class="instruccion">Al tocar «Guardar», el nombre queda en <code>localStorage</code>. Al recargar, si ya hay un nombre, aparece un saludo. El código va en <code>10-nombre.js</code>.</p>
  <div class="caja">
    <label for="nombre">Tu nombre</label>
    <input type="text" id="nombre">
    <button id="guardar" type="button">Guardar</button>
    <p class="salida" id="saludo"></p>
  </div>
</main>
<script src="10-nombre.js" defer></script>
</body>
</html>
