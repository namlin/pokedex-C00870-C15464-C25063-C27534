<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ej. 11 — Favoritos que quedan</title>
<link rel="stylesheet" href="../estilos.css">
</head>
<body>
<main>
  <h1>Ejercicio 11 — Favoritos que quedan</h1>
  <p class="instruccion">Al tocar ♥, el color entra o sale de favoritos, y se guarda para que siga marcado al recargar. El código va en <code>11-favoritos.js</code>.</p>
  <div class="caja">
    <ul>
      <li class="fila color" data-color="rojo"><span>Rojo</span><button class="toggle" type="button" aria-pressed="false" aria-label="Favorito: rojo">♥</button></li>
      <li class="fila color" data-color="verde"><span>Verde</span><button class="toggle" type="button" aria-pressed="false" aria-label="Favorito: verde">♥</button></li>
      <li class="fila color" data-color="azul"><span>Azul</span><button class="toggle" type="button" aria-pressed="false" aria-label="Favorito: azul">♥</button></li>
    </ul>
  </div>
</main>
<script src="11-favoritos.js" defer></script>
</body>
</html>
